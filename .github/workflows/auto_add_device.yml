name: Auto Add Device Support

on:
  workflow_dispatch:
    inputs:
      bootloader_url:
        description: 'Direct download URL for LK image (lk.img / .bin)'
        required: true
        type: string
      product_name:
        description: 'Product Name (e.g., Xiaomi 13, Nothing Phone 2a)'
        required: true
        type: string

jobs:
  analyze-and-add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download LK Image
        run: |
          mkdir -p temp bin .github/scripts
          curl -sSL -A "Mozilla/5.0" "${{ github.event.inputs.bootloader_url }}" -o temp/lk.bin
          
          # Check if download was successful and file is not empty
          if [ ! -s temp/lk.bin ]; then
            echo "::error::Downloaded LK image is empty or failed to download. Please check the URL."
            exit 1
          fi
          
          # Check if the downloaded file is an HTML page (common error for bad direct links)
          if head -c 256 temp/lk.bin | grep -qiE "<!DOCTYPE|<html|<head"; then
            echo "::error::The provided URL returned an HTML page instead of a binary file. Please provide a DIRECT download link to the raw lk.img file."
            exit 1
          fi

      - name: Analyze LK and Generate Config
        id: analyze
        run: |
          python3 .github/scripts/analyze_lk.py temp/lk.bin "${{ github.event.inputs.product_name }}" > temp/config.txt
          cat temp/config.txt
          sed -n '/--- GENERATED CONFIG ---/,/--- END CONFIG ---/p' temp/config.txt | sed '/---/d' > temp/device_entry.txt
          
          if [ ! -s temp/device_entry.txt ] || ! grep -q 'Device(' temp/device_entry.txt; then
            echo "::error::Analysis failed to generate a valid device configuration. No patterns were found or the output was malformed."
            exit 1
          fi

      - name: Update devices.py
        run: |
          # Ensure the injector directory exists
          mkdir -p injector
          # If devices.py doesn't exist, create it with a basic structure
          if [ ! -f injector/devices.py ]; then
            printf "from cert_bypass import CertBypass\nfrom device import Device\nfrom stage import PayloadStage, PatchStage\nfrom patch_utils import MatchMode\n\nDEVICES = [\n]\n" > injector/devices.py
          fi

          python3 -c "
          import sys

          # Add current directory and injector to Python search path safely
          sys.path.insert(0, '.')
          sys.path.insert(0, 'injector')

          try:
              from patch_utils import MatchMode
          except ImportError:
              print('Warning: patch_utils.py not found. Ensure it\'s in the injector directory or accessible.')
              class MatchMode:
                  ALL = 'ALL'
                  FIRST = 'FIRST'

          with open('injector/devices.py', 'r') as f:
              content = f.read()
          with open('temp/device_entry.txt', 'r') as f:
              new_device = f.read().strip()

          # Find the DEVICES = [ ... ] list and inject before the closing bracket
          idx = content.rfind(']')
          if idx != -1:
              updated_content = content[:idx] + '    ' + new_device + '\n' + content[idx:]
              with open('injector/devices.py', 'w') as f:
                  f.write(updated_content)
          else:
              print('Could not find DEVICES list in injector/devices.py.')
              sys.exit(1)
          "

      - name: Copy binary to bin directory
        run: |
          # FIX: Copy the downloaded LK binary to bin/ directory with proper codename
          CODENAME=$(echo "${{ github.event.inputs.product_name }}" | tr '[:upper:]' '[:lower:]' | tr ' -' '__' | tr -d "'." | tr -s '_')
          cp temp/lk.bin "bin/${CODENAME}.bin"
          echo "Copied binary to bin/${CODENAME}.bin"

      - name: Update README.md
        run: |
          # FIX: Add the new device to the README supported devices table
          CODENAME=$(echo "${{ github.event.inputs.product_name }}" | tr '[:upper:]' '[:lower:]' | tr ' -' '__' | tr -d "'." | tr -s '_')
          PRODUCT_NAME="${{ github.event.inputs.product_name }}"
          
          # Find the end of the devices table (line with just |)
          # Insert the new device row before the empty line after the last device entry
          if grep -q "The following devices are currently supported:" README.md; then
              # Add the new device to the table
              sed -i "/| .*|.*| \`.*\` |$/a | ${PRODUCT_NAME} | \`${CODENAME}\` |" README.md || true
              
              # If sed insertion didn't work, use python to insert before the closing line of the table
              python3 -c "
          import re
          with open('README.md', 'r') as f:
              content = f.read()
          
          codename = '${CODENAME}'
          product_name = '${PRODUCT_NAME}'
          new_row = f'| {product_name} | \`{codename}\` |'
          
          # Check if device already exists in table
          if codename in content:
              print(f'Device {codename} already exists in README.md, skipping table update.')
          else:
              # Find the table section and insert before the empty separator line
              lines = content.split('\n')
              new_lines = []
              inserted = False
              for i, line in enumerate(lines):
                  if not inserted and line.startswith('|') and '|' in line[1:] and (i + 1 < len(lines)) and lines[i+1].strip() == '':
                      new_lines.append(line)
                      new_lines.append(new_row)
                      inserted = True
                      continue
                  new_lines.append(line)
              
              if not inserted:
                  # Fallback: insert before the line starting with 'Adding support'
                  for i, line in enumerate(new_lines):
                      if line.startswith('Adding support'):
                          new_lines.insert(i, '')
                          new_lines.insert(i, new_row)
                          inserted = True
                          break
              
              if inserted:
                  with open('README.md', 'w') as f:
                      f.write('\n'.join(new_lines))
                  print(f'Added {codename} to README.md')
              else:
                  print('Could not find suitable insertion point in README.md')
          "
          else
              echo "Warning: Could not find supported devices section in README.md"
          fi

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add injector/devices.py
          git add bin/
          git add README.md
          git commit -m "feat: Add support for ${{ github.event.inputs.product_name }}"
          git push
