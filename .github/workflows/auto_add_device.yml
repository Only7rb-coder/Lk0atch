name: Auto Add Device Support

on:
  workflow_dispatch:
    inputs:
      bootloader_url:
        description: 'Direct download URL for LK image (lk.img / .bin)'
        required: true
        type: string
      product_name:
        description: 'Product Name (e.g., Xiaomi 13, Nothing Phone 2a)'
        required: true
        type: string

jobs:
  analyze-and-add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download LK Image
        run: |
          mkdir -p temp .github/scripts
          curl -sSL -A "Mozilla/5.0" "${{ github.event.inputs.bootloader_url }}" -o temp/lk.bin
          
          # Check if download was successful and file is not empty
          if [ ! -s temp/lk.bin ]; then
            echo "::error::Downloaded LK image is empty or failed to download. Please check the URL."
            exit 1
          fi
          
          # Check if the downloaded file is an HTML page (common error for bad direct links)
          if head -c 256 temp/lk.bin | grep -qiE "<!DOCTYPE|<html|<head"; then
            echo "::error::The provided URL returned an HTML page instead of a binary file. Please provide a DIRECT download link to the raw lk.img file."
            exit 1
          fi

      - name: Analyze LK and Generate Config
        id: analyze
        run: |
          python3 .github/scripts/analyze_lk.py temp/lk.bin "${{ github.event.inputs.product_name }}" > temp/config.txt
          cat temp/config.txt
          sed -n '/--- GENERATED CONFIG ---/,/--- END CONFIG ---/p' temp/config.txt | sed '/---/d' > temp/device_entry.txt
          
          if [ ! -s temp/device_entry.txt ] || ! grep -q 'Device(' temp/device_entry.txt; then
            echo "::error::Analysis failed to generate a valid device configuration. No patterns were found or the output was malformed."
            exit 1
          fi

      - name: Update devices.py
        run: |
          # Ensure the injector directory exists
          mkdir -p injector
          # If devices.py doesn't exist, create it with a basic structure
          if [ ! -f injector/devices.py ]; then
            printf "from cert_bypass import CertBypass\nfrom device import Device\nfrom stage import PayloadStage, PatchStage\nfrom patch_utils import MatchMode\n\nDEVICES = [\n]\n" > injector/devices.py
          fi

          python3 -c "
          import sys

          # Add current directory and injector to Python search path safely
          sys.path.insert(0, '.')
          sys.path.insert(0, 'injector')

          try:
              from patch_utils import MatchMode
          except ImportError:
              print('Warning: patch_utils.py not found. Ensure it\'s in the injector directory or accessible.')
              class MatchMode:
                  ALL = 'ALL'
                  FIRST = 'FIRST'

          with open('injector/devices.py', 'r') as f:
              content = f.read()
          with open('temp/device_entry.txt', 'r') as f:
              new_device = f.read().strip()

          # Find the DEVICES = [ ... ] list and inject before the closing bracket
          idx = content.rfind(']')
          if idx != -1:
              updated_content = content[:idx] + '    ' + new_device + '\n]' + content[idx+1:]
              with open('injector/devices.py', 'w') as f:
                  f.write(updated_content)
          else:
              print('Could not find DEVICES list in injector/devices.py.')
              sys.exit(1)
          "

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add injector/devices.py
          git commit -m "feat: Add support for ${{ github.event.inputs.product_name }}"
          git push
