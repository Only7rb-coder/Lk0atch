name: Build Patched Bootloader

on:
  workflow_dispatch:
    inputs:
      bootloader_url:
        description: 'Direct download URL for bootloader image (lk.img / .bin)'
        required: true
        type: string
      device_codename:
        description: 'Device codename (e.g., pacman, tetris, duchamp, rodin)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Set permissions for scripts
        run: |
          chmod +x build.sh || true
          chmod +x flash.sh || true

      - name: Download bootloader image
        run: |
          mkdir -p bin
          CODENAME="${{ github.event.inputs.device_codename }}"
          TARGET_PATH="bin/${CODENAME}.bin"

          curl -sSL -A "Mozilla/5.0" "${{ github.event.inputs.bootloader_url }}" -o "$TARGET_PATH"

          echo "Downloaded file type info for $TARGET_PATH:"
          file "$TARGET_PATH"

          if head -c 256 "$TARGET_PATH" | grep -qiE "<!DOCTYPE|<html|<head"; then
            echo "------------------------------------------------------------"
            echo "::error::The URL returned an HTML page instead of a binary file!"
            echo "Provide a DIRECT download link to the raw lk.img file."
            echo "------------------------------------------------------------"
            exit 1
          fi

          if [ ! -s "$TARGET_PATH" ]; then
            echo "::error::Downloaded file is empty! Check the URL."
            exit 1
          fi

      - name: Run build script
        run: |
          CODENAME="${{ github.event.inputs.device_codename }}"
          TARGET_PATH="bin/${CODENAME}.bin"
          
          ./build.sh "$CODENAME" "$TARGET_PATH" || ./build.sh "$CODENAME"

      - name: Locate output binary
        run: |
          CODENAME="${{ github.event.inputs.device_codename }}"
          
          # Detect output filename generated by build.sh
          if [ -f "lk.patched" ]; then
            echo "Found lk.patched"
            cp lk.patched output_bootloader.bin
          elif [ -f "${CODENAME}-fenrir.bin" ]; then
            echo "Found ${CODENAME}-fenrir.bin"
            cp "${CODENAME}-fenrir.bin" output_bootloader.bin
          else
            # Search for any generated patched/fenrir bin file in root
            FOUND_FILE=$(ls -t *-fenrir.bin *.patched 2>/dev/null | head -n 1)
            if [ -n "$FOUND_FILE" ]; then
              echo "Found generated output: $FOUND_FILE"
              cp "$FOUND_FILE" output_bootloader.bin
            else
              echo "::error::Could not find generated patched bootloader image!"
              exit 1
            fi
          fi

      - name: Upload patched bootloader artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lk-patched-${{ github.event.inputs.device_codename }}
          path: output_bootloader.bin
          if-no-files-found: error
